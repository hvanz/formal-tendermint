\* TLC configuration for the model of TendermintPartialSync.tla.
\* Companion module: TendermintPartialSyncMC.tla

\* Liveness spec with fairness: required so TLC checks the liveness
\* PROPERTY under weak fairness. 'Nat <- MCNat' bounds every 'r \in Rounds'
\* quantifier AND the clock `now` (and 'f \in Nat').
SPECIFICATION MCLiveSpec

CONSTANTS
  Validators <- MCValidators
  Faulty     <- MCFaulty
  f          = 1
  Values     = {a}
  Valid      <- MCValid
  Proposer   <- MCProposer
  Delta       = 1
  GST         = 0
  T0Propose   = 7
  T0Prevote   = 5
  T0Precommit = 5
  TDelta      = 1
  nil         = "nil"
  Nat         <- MCNat

\* Bound validRound so Message is finite (see MCProposalMsg).
CONSTANT ProposalMsg <- MCProposalMsg

\* GST = 0 is the SYNCHRONOUS case. TLC stopped on a full disk after 3 h 55
\* min with 4 workers. It found no violation in 369,406 distinct states. The
\* check is not exhaustive: 209,519 states were still in the queue. That run
\* used the earlier strict Tick guard with Delta = 2, which gives the same
\* behaviors as the present guard with Delta = 1.
\* This configuration does not check a GST > 0 RECOVERY case (round 0 fails
\* before GST, a later round decides after GST).

\* Decided/quiescent states have no enabled action; suppress deadlock.
CHECK_DEADLOCK FALSE

\* Nonvacuous finite projection of the public termination condition.
INVARIANT MCTerminationConditions
PROPERTY MCTermination

\* Safety invariants (honest-scoped, as in TendermintByzantine).
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT Validity
