\* LockRetry Phase 0 check 3: the retry terminates on the continuation of the
\* disrupted run. Good round 1 is disrupted by a round-0 lock; good round 2
\* follows twelve instants later, is NOT disrupted, and decides.
SPECIFICATION MCSpec

CONSTANTS
  MCScenario = "lock-retry"
  Validators <- MCValidators
  Faulty     <- MCFaulty
  f          = 1
  Values     = {a, b}
  Valid      <- MCValid
  Proposer   <- MCProposer
  Delta       = 2
  GST         = 0
  T0Propose   = 1
  T0Prevote   = 1
  T0Precommit = 1
  TDelta      = 5
  nil         = "nil"
  Nat         <- MCNat

CONSTANT ProposalMsg <- MCProposalMsg

CHECK_DEADLOCK FALSE

\* MCLockRetryComplete separates a stalled script from a false property.
PROPERTY MCLockRetryComplete
PROPERTY MCLockRetryChecks

INVARIANT MCLockRetryUnlatched
INVARIANT MCLockRetryTerminal
INVARIANT MCHonestMessageAfterEntry
INVARIANT MCRoundEntryHistory
INVARIANT TypeOK
