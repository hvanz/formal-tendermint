\* TLC configuration for the model of TendermintByzantine.tla.
\* Companion module: TendermintByzantineMC.tla

\* Use the spec's own Init and the restricted MCNext (the faulty round-0
\* proposer v4 is a Byzantine leader: MCFaultyStep emits equivocating
\* proposals as well as prevotes/precommits, all at round 0; see
\* TendermintByzantineMC.tla). 'Nat <- MCRounds' bounds every 'r \in Rounds'.
INIT Init
NEXT MCNext

CONSTANTS
  Validators <- MCValidators
  Faulty     <- MCFaulty
  Values     = {x, y}
  Valid      <- MCValid
  Proposer   <- MCProposer
  ByzQuorum  <- MCByzQuorum
  WeakQuorum <- MCWeakQuorum
  nil        = "nil"
  Nat        <- MCRounds

\* Stop exploring once an honest validator would advance past MaxRound.
CONSTRAINT MCStateConstraint

\* Decided/quiescent states have no enabled action; suppress deadlock.
CHECK_DEADLOCK FALSE

\* Quotient by value permutations (sound for the symmetric invariants).
SYMMETRY MCSymmetry

\* Invariants to check (Agreement/Validity are honest-scoped in TendermintByzantine).
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT Validity
