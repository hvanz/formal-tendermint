\* TLC configuration for the model of TendermintVoting.tla.
\* Companion module: TendermintVotingMC.tla

\* Use MCInit (spec Init plus all canonical proposals pre-loaded) and MCNext
\* (the vote/decide actions; no Propose, since proposals are constant). See
\* TendermintVotingMC.tla for why this is sound for Agreement and tractable.
\* The 'Nat <- MCRounds' substitution bounds every 'r \in Rounds' quantifier.
INIT MCInit
NEXT MCNext

\* Substitute spec CONSTANTS with the corresponding MC operators, override
\* the defined operator 'nil' with a model value, and override the Naturals
\* operator 'Nat' to a finite range so TLC can enumerate Rounds-typed
\* quantifiers.
CONSTANTS
  Validators = {v1, v2, v3, v4}
  Values     = {x, y}
  Valid      <- MCValid
  Quorum     <- MCQuorum
  nil        = "nil"
  Nat        <- MCRounds

\* Once every validator has decided, and all in-round votes are cast, no
\* action is enabled. TLC's default reads this as deadlock; suppress it.
CHECK_DEADLOCK FALSE

\* Quotient the state space by validator/value permutations (sound for the
\* symmetric invariants below).
SYMMETRY MCSymmetry

\* Invariants to check.
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT Validity
