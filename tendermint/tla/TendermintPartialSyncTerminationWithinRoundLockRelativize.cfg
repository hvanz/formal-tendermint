\* LockRetry Phase 0 check 2: the relativization un-latches. At the round-2
\* entry the round-0 lock still satisfies PostGSTPriorRoundLock(2) and every
\* conjunct of the blocking event except the entry timestamp, so the timestamp
\* alone is what re-arms the disjunct for a later round.
SPECIFICATION MCSpec

CONSTANTS
  MCScenario = "lock-relativize"
  Validators <- MCValidators
  Faulty     <- MCFaulty
  f          = 1
  Values     = {a, b}
  Valid      <- MCValid
  Proposer   <- MCProposer
  Delta       = 2
  GST         = 0
  T0Propose   = 1
  T0Prevote   = 1
  T0Precommit = 1
  TDelta      = 5
  nil         = "nil"
  Nat         <- MCNat

CONSTANT ProposalMsg <- MCProposalMsg

CHECK_DEADLOCK FALSE

\* MCLockRelativizeComplete separates a stalled script from a false property.
PROPERTY MCLockRelativizeComplete

INVARIANT MCLockRelativizeTerminal
INVARIANT MCHonestMessageAfterEntry
INVARIANT MCRoundEntryHistory
INVARIANT TypeOK
