\* Window-lemma refutation. LateValueLockWindow (...RoundProgress) is FALSE as
\* first stated. Its recorded proof needs arm_x >= GST for the step "x's arming
\* quorum reaches c within Delta"; DeliveryDeadline is max(sentTime, GST) +
\* Delta, so a pre-GST send may be withheld until GST + Delta.
\* Round 1 of this run is not a Lemma 5 round. h1 enters it at now = 5, and
\* Lemma5Hyp needs now >= GST + TimeoutPrecommit(0) = 7.
\*
\* Constants, and why each fits. Delta = 2 and GST = 4 are not forced. TLC
\* also finds the violation with Delta = 1, and with GST = 3.
\*   Delta = 2       -- the disruption instant must land in (GST, GST + Delta],
\*                      where a message sent before GST can still be pending.
\*   GST = 4         -- every round-0 message is then sent pre-GST, so h3's two
\*                      missing prevotes are held to now = 5 while
\*                      h1 and h2 get theirs at once.
\*   T0Propose = 1   -- h2 gives up proposing at now = 1.
\*   T0Prevote = 1   -- h1 and h2 precommit nil at now = 2.
\*   T0Precommit = 3 -- > Delta, which is what the invariant denies, and
\*                      2 + 3 = GST + 1, so h1 enters round 1 at now = 5.
\*   TDelta = 7      -- gives MCLemma5Timeouts(1), because 1 + 7 = 8 > 2*2.
\*                      A deleted timeout margin assumption forced this
\*                      value. The script keeps it.
SPECIFICATION MCSpec

CONSTANTS
  MCScenario = "window-gst"
  Validators <- MCValidators
  Faulty     <- MCFaulty
  f          = 1
  Values     = {a, b}
  Valid      <- MCValid
  Proposer   <- MCProposer
  Delta       = 2
  GST         = 4
  T0Propose   = 1
  T0Prevote   = 1
  T0Precommit = 3
  TDelta      = 7
  nil         = "nil"
  Nat         <- MCNat

CONSTANT ProposalMsg <- MCProposalMsg

CHECK_DEADLOCK FALSE

PROPERTY MCWindowGstComplete
PROPERTY MCWindowGstDisrupted

INVARIANT MCLateValueLockWindowRepaired
INVARIANT MCLateValueLockWindow
INVARIANT TypeOK
