\* TLC configuration for the smoke-test model of TendermintOperational.tla.
\* Companion module: TendermintOperationalMC.tla

\* Use MCInit (spec Init with a constant proposal set pre-loaded) and
\* MCNext (the spec's Next without Propose; the leaderless Propose is
\* intractable at N=4). The 'Nat <- MCRounds' substitution bounds every
\* 'r \in Rounds' (= 'r \in Nat') quantifier in the spec, including the
\* internal one in OnPrecommitQuorumValue and the outer one in SkipRound.
INIT MCInit
NEXT MCNext

\* The spec is leaderless: no Proposer constant. SkipRound is gated on a
\* single message at the higher round (ExistsMessageAt(r)).

\* Substitute spec CONSTANTS with the corresponding MC operators, and
\* override the Naturals operator 'Nat' to a finite range so TLC can
\* enumerate the spec's Rounds-typed quantifiers.
CONSTANTS
  Validators  <- MCValidators
  Values      <- MCValues
  Valid       <- MCValid
  Quorum      <- MCQuorum
  nil         = "nil"
  Nat         <- MCRounds

\* Bound the state space.
CONSTRAINT
  MCStateConstraint

\* Once every validator has decided, no action is enabled (the protocol
\* has terminated). TLC's default reads this as deadlock; suppress it.
CHECK_DEADLOCK FALSE

\* Invariants to check.
INVARIANT
  TypeOK
INVARIANT
  Agreement
