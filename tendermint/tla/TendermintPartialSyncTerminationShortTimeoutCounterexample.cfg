\* Expected failure. Run explicitly, never from the normal passing target.
\* TLC reaches a failed honest-proposer round and then reports that the old
\* Termination formula is false on the bounded terminal stutter.
\* MCShortTimeoutReachability HOLDS here; MCOldTermination is the violation.
\*
\* The constants are forced, writing P/V/C for the base propose/prevote/
\* precommit timeouts, D for Delta and T for TDelta:
\*   (a) the script Ticks from now = 0 to now = P-1, and each Tick needs
\*       now + 1 < GST + D, so P <= D - 1;
\*   (b) ProposeTimeoutMargin needs T > 2*D + C - P;
\*   (b2) PrevoteTimeoutMargin needs T > 2*D + C - V;
\*   (c) the target state needs ~MCLemma5Timeouts(1). After (b) and (b2) the
\*       propose and prevote conjuncts hold at EVERY round, so the round-1
\*       precommit conjunct is the one that has to fail: C + T <= 2*D.
\* (b) and (c) give P > 2*C, so P >= 3, and then (a) gives D >= 4. At D = 4
\* the solution is P = 3, C = 1 and T = 7, and (b2) then forces V >= 3.
\* TimeoutPrecommit(1) = 8 is not > 2*D = 8, which is the falsified conjunct.
\* V was 1 until PrevoteTimeoutMargin was added, when the falsified conjunct
\* moved from the prevote clause to the precommit clause.
\* Every other configuration in this directory uses D = 2.
SPECIFICATION MCSpec

CONSTANTS
  MCScenario = "short-timeout"
  Validators <- MCValidators
  Faulty     <- MCFaulty
  f          = 1
  Values     = {a, b}
  Valid      <- MCValid
  Proposer   <- MCFixedHonestProposer
  Delta       = 4
  GST         = 0
  T0Propose   = 3
  T0Prevote   = 3
  T0Precommit = 1
  TDelta      = 7
  nil         = "nil"
  Nat         <- MCNat

CONSTANT ProposalMsg <- MCProposalMsg

CHECK_DEADLOCK FALSE

PROPERTY MCOldTermination
PROPERTY MCShortTimeoutReachability

INVARIANT TypeOK
