\* Expected failure. Run explicitly, never from the normal passing target.
\* TLC reaches a failed honest-proposer round and then reports that the old
\* Termination formula is false on the bounded terminal stutter.
\* MCShortTimeoutReachability HOLDS here; MCOldTermination is the violation.
\*
\* The constants, writing P/V/C for the base propose/prevote/precommit
\* timeouts, D for Delta and T for TDelta:
\*   (a) the script Ticks from now = 0 to now = P-1, and each Tick needs
\*       now < GST + D, so P <= D;
\*   (b) the target state needs ~MCLemma5Timeouts(1). At round 1 the propose
\*       and prevote conjuncts hold, because P + T = V + T = 10 > 2*D = 8.
\*       The precommit conjunct fails, because C + T = 8 is not > 2*D = 8.
\* Two timeout margin assumptions of TendermintPartialSync forced these
\* constants. Those assumptions are deleted, so other constants can also give
\* this counterexample. These constants still give it.
\* Every other termination configuration in this directory uses D = 2.
\* TendermintPartialSyncMC.cfg uses D = 1.
SPECIFICATION MCSpec

CONSTANTS
  MCScenario = "short-timeout"
  Validators <- MCValidators
  Faulty     <- MCFaulty
  f          = 1
  Values     = {a, b}
  Valid      <- MCValid
  Proposer   <- MCFixedHonestProposer
  Delta       = 4
  GST         = 0
  T0Propose   = 3
  T0Prevote   = 3
  T0Precommit = 1
  TDelta      = 7
  nil         = "nil"
  Nat         <- MCNat

CONSTANT ProposalMsg <- MCProposalMsg

CHECK_DEADLOCK FALSE

PROPERTY MCOldTermination
PROPERTY MCShortTimeoutReachability

INVARIANT TypeOK
